<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><defs><marker id="ah-d0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de"/></marker><marker id="ah-656d76" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker><marker id="ah-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="ah-cf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker><marker id="ah-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="ah-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="ah-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker></defs><rect width="980" height="400" fill="#ffffff"/><text x="30" y="36" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2328">Why locking the scale is the core requirement</text><text x="30" y="58" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">An AR viewer that renders the wrong size is worse than no AR viewer at all</text><rect x="40" y="96" width="410" height="150" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.8"/><text x="245.0" y="140.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Pinch-to-resize left enabled</text><text x="245.0" y="158.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76"></text><text x="245.0" y="176.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">User silently rescales the model</text><text x="245.0" y="194.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">A 79.9 cm unit looks like it fits a 60 cm gap</text><text x="245.0" y="212.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Purchase decided on a false image</text><rect x="530" y="96" width="410" height="150" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/><text x="735.0" y="140.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">ar-scale="fixed"</text><text x="735.0" y="158.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76"></text><text x="735.0" y="176.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Models authored in real metres</text><text x="735.0" y="194.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Resize gesture disabled outright</text><text x="735.0" y="212.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Measured on the wall = delivered size</text><rect x="40" y="286" width="900" height="76" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/><text x="490.0" y="311.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Orientation states kept separate</text><text x="490.0" y="329.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Wall-mounted and floor-standing products hold independent rotation states.</text><text x="490.0" y="347.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">An earlier build derived wall orientation from the floor case and leaked rotation.</text></svg>