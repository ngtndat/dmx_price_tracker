<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><defs><marker id="ah-d0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de"/></marker><marker id="ah-656d76" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/></marker><marker id="ah-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker><marker id="ah-cf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/></marker><marker id="ah-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="ah-bc4c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/></marker><marker id="ah-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><text x="30" y="36" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2328">smart_get() - three-stage escalation</text><text x="30" y="58" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#656d76">Actions runners sit outside Vietnam; several retailers rate-limit or geo-fence foreign traffic</text><rect x="40" y="96" width="260" height="76" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/><text x="170.0" y="121.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">1. Direct request</text><text x="170.0" y="139.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">requests.get() - 15s timeout</text><text x="170.0" y="157.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Fastest, no proxy cost</text><rect x="370" y="96" width="260" height="76" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/><text x="500.0" y="121.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">2. Cached proxy</text><text x="500.0" y="139.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">reuse last winning proxy</text><text x="500.0" y="157.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Most calls hit the same host</text><rect x="700" y="96" width="260" height="76" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/><text x="830.0" y="121.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">3. Rotate the pool</text><text x="830.0" y="139.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">try up to 25 VN proxies</text><text x="830.0" y="157.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Evict dead proxies as found</text><line x1="300" y1="134" x2="368" y2="134" stroke="#656d76" stroke-width="1.8" marker-end="url(#ah-656d76)"/><text x="334.0" y="126" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76">fails / non-200</text><line x1="630" y1="134" x2="698" y2="134" stroke="#656d76" stroke-width="1.8" marker-end="url(#ah-656d76)"/><text x="664.0" y="126" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11" fill="#656d76">proxy dead</text><rect x="700" y="214" width="260" height="56" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4"/><text x="830.0" y="238.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Pool drops below 5</text><text x="830.0" y="256.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">refetch the proxy list</text><line x1="830" y1="172" x2="830" y2="212" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#ah-bc4c00)"/><rect x="370" y="300" width="260" height="62" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.8"/><text x="500.0" y="327.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Return None</text><text x="500.0" y="345.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">log it, skip this retailer</text><line x1="700" y1="250" x2="632" y2="300" stroke="#cf222e" stroke-width="1.8" marker-end="url(#ah-cf222e)"/><text x="560" y="282" text-anchor="end" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#cf222e">exhausted</text><rect x="40" y="300" width="260" height="62" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/><text x="170.0" y="327.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Return response</text><text x="170.0" y="345.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">retailer parser continues</text><line x1="170" y1="172" x2="170" y2="298" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#ah-1a7f37)"/><text x="205" y="240" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11" fill="#1a7f37">200 OK</text><text x="30" y="400" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Proxy sources: ProxyScrape + Geonode - free tiers, fetched lazily only after a direct request fails</text></svg>