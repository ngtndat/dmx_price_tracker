6" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/><text x="145.0" y="129.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">User</text><text x="145.0" y="147.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">types 'Quet' in chat</text><rect x="300" y="100" width="230" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/><text x="415.0" y="129.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">telegram_listener.yml</text><text x="415.0" y="147.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">cron every 5 minutes</text><rect x="580" y="100" width="230" height="66" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.8"/><text x="695.0" y="129.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">getUpdates</text><text x="695.0" y="147.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">read unconfirmed messages</text><line x1="250" y1="133" x2="298" y2="133" stroke="#656d76" stroke-width="1.8" marker-end="url(#ah-656d76)"/><line x1="530" y1="133" x2="578" y2="133" stroke="#656d76" stroke-width="1.8" marker-end="url(#ah-656d76)"/><rect x="300" y="208" width="230" height="86" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/><text x="415.0" y="229.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">Three guards</text><text x="415.0" y="247.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">sender is TELEGRAM_CHAT_ID</text><text x="415.0" y="265.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">message younger than 6 min</text><text x="415.0" y="283.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">offset confirmed after use</text><line x1="695" y1="166" x2="500" y2="206" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#ah-1a7f37)"/><rect x="620" y="208" width="230" height="66" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.8"/><text x="735.0" y="237.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328">workflow_dispatch</text><text x="735.0" y="255.0" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">fire scraper via GitHub API</text><line x1="530" y1="241" x2="618" y2="241" stroke="#bc4c00" stroke-width="1.8" marker-end="url(#ah-bc4c00)"/><text x="30" y="336" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2328">Why the offset confirmation matters:</text><text x="30" y="356" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">Telegram retains an update until it is acknowledged. Without this step the same message re-fires</text><text x="30" y="374" text-anchor="start" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#656d76">the workflow on every poll - one scrape every five minutes, forever.</text></svg>