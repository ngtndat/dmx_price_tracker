name: LG Price Scraper - Tự động quét giá

on:
  schedule:
    # Múi giờ GitHub Actions là UTC. VN = UTC+7
    # 7:00 VN  = 00:00 UTC
    - cron: '0 0 * * *'
    # 9:30 VN  = 02:30 UTC
    - cron: '30 2 * * *'
    # 12:00 VN = 05:00 UTC
    - cron: '0 5 * * *'
    # 16:00 VN = 09:00 UTC
    - cron: '0 9 * * *'
    # 20:00 VN = 13:00 UTC
    - cron: '0 13 * * *'
  # Cho phép bấm Run thủ công trên GitHub
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Quét Máy Lọc Không Khí + Máy Hút Ẩm LG
  # ============================================================
  scrape-air-purifier:
    name: "🌬️ Máy Lọc KK & Máy Hút Ẩm LG"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests[socks] beautifulsoup4 gspread urllib3 matplotlib

      - name: Run full_colab_scraper.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          SHEET_NAME: Sheet1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python full_colab_scraper.py

  # ============================================================
  # JOB 2: Quét Máy Lạnh LG
  # ============================================================
  scrape-air-conditioner:
    name: "❄️ Máy Lạnh (Điều Hòa) LG"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests[socks] beautifulsoup4 gspread urllib3 matplotlib

      - name: Run lg_ac_colab_scraper.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          SHEET_NAME: raw_RAC
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lg_ac_colab_scraper.py
